version: '3.8'

services:
  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: doc-rag-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8080/api/v1
    depends_on:
      - backend

  # Spring Boot 3.3 Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: doc-rag-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres-pgvector:5432/doc_intelligence
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=secret
    depends_on:
      postgres-pgvector:
        condition: service_healthy

  # PostgreSQL 16 with pgvector Extension
  postgres-pgvector:
    image: pgvector/pgvector:pg16
    container_name: doc-rag-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: doc_intelligence
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata_vector:/var/lib/postgresql/data
      - ./backend/src/main/resources/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doc_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata_vector:
